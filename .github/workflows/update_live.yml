name: Update Douyin Live M3U

on:
  # ⏰ 自动运行频率：可以自己改，比如每 4 小时自动更新一次
  schedule:
    - cron: '0 */4 * * *' 
  
  # 🖱️ 支持在 GitHub 网页上手动点按钮一键运行
  workflow_dispatch:

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取仓库代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 配置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. 安装依赖与 Playwright 浏览器内核
    - name: Install dependencies & Playwright
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install --with-deps

    # 4. 运行你的 Python 抓取脚本（请把这里的文件名换成你实际的脚本名）
    - name: Run Python script
      run: |
        python gemini-code-1789337815793.py

    # 5. 自动把生成的 M3U 文件提交并推送到你的仓库
    - name: Commit and push M3U file
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add douyin_all_categories.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Douyin M3U list [skip ci]" && git push)
