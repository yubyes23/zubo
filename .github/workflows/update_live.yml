name: Update Douyin Live M3U

on:
  schedule:
    - cron: '13 */3 * * *'
  workflow_dispatch:

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps

      - name: Run Python script
        run: |
          python 1789337815793.py

      - name: Commit and push M3U file
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add douyin_all.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Douyin M3U list [skip ci]" && git push)
